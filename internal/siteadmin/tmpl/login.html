{{define "main"}}
<div class="card">
  <h1>{{.Brand}} · Admin</h1>
  <form method="post" action="{{.A}}/login">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{.D.Email}}" placeholder="you@example.com" required autofocus>
    <label for="pw">Password</label>
    <input id="pw" type="password" name="password" placeholder="Your password" required>
    <div class="actions"><button class="btn main" type="submit">Log in</button></div>
  </form>
</div>
{{end}}
